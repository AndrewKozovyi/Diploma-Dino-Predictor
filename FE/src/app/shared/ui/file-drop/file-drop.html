<input
  #input
  class="visually-hidden"
  type="file"
  [id]="id"
  [accept]="acceptAttribute()"
  [disabled]="disabled()"
  [attr.tabindex]="file() ? -1 : null"
  (change)="onInputChange($event)"
/>
<div
  class="file-drop-area"
  [class.file-drop-dragging]="dragging()"
  (dragover)="onDragOver($event)"
  (dragleave)="dragging.set(false)"
  (drop)="onDrop($event)"
>
  @if (previewUrl(); as url) {
    <figure class="preview">
      <div class="preview-frame">
        <img class="preview-image" [src]="url" [alt]="file()?.name" />
        @if (dragging()) {
          <div class="preview-replace">
            <app-icon name="upload" [size]="24" />
            {{ 'fileDrop.dropToReplace' | t }}
          </div>
        }
      </div>
      <figcaption class="preview-caption">
        <span class="preview-info">
          <span class="preview-name">{{ file()?.name }}</span>
          <span class="hint">{{ fileSize() }}</span>
        </span>
        @if (!disabled()) {
          <span class="preview-actions">
            <button class="btn btn-secondary" type="button" (click)="browse()">
              <app-icon name="image" [size]="18" />
              {{ 'fileDrop.change' | t }}
            </button>
            <button
              class="btn btn-secondary"
              type="button"
              [attr.aria-label]="'fileDrop.remove' | t"
              (click)="remove()"
            >
              <app-icon name="close" [size]="18" />
            </button>
            <ng-content />
          </span>
        }
      </figcaption>
    </figure>
  } @else {
    <label class="file-drop" [class.file-drop-disabled]="disabled()" [for]="id">
      <span class="file-drop-icon"><app-icon name="upload" [size]="24" /></span>
      <span class="file-drop-title">{{ 'fileDrop.prompt' | t }}</span>
      <span class="hint">{{ 'fileDrop.limits' | t: { formats: formats(), size: maxSizeMegabytes() } }}</span>
    </label>
  }
</div>
@switch (rejection()) {
  @case ('type') {
    <p class="error-text" role="alert">{{ 'fileDrop.unsupportedType' | t: { formats: formats() } }}</p>
  }
  @case ('size') {
    <p class="error-text" role="alert">{{ 'fileDrop.tooLarge' | t: { size: maxSizeMegabytes() } }}</p>
  }
}
